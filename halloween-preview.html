<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ハロウィン家具・配置プレビュー</title><style>
*{box-sizing:border-box}body{margin:0;background:#f7eedc;color:#533b31;font-family:Meiryo,sans-serif}header,section{max-width:1320px;margin:auto;padding:12px 18px}h1{font-size:22px;margin:0 0 5px}p{font-size:13px;margin:4px 0 10px}nav{display:flex;gap:8px;flex-wrap:wrap;align-items:center}label{font-size:13px;display:flex;gap:5px;align-items:center}select,button{font:inherit;border:1px solid #b6a2bc;border-radius:8px;padding:7px;background:#fff9ee;color:#533b31;cursor:pointer}select:focus-visible,button:focus-visible{outline:3px solid #986ac4}button:hover{background:#f7ddec}iframe{display:block;border:0;width:min(100%,1320px);height:calc(100svh - 170px);min-height:380px;max-height:820px;margin:auto;background:#203c33}section{padding-top:24px}.assets{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}.asset{margin:0;background:#fffaf2;padding:12px;border-radius:12px}.asset img{width:100%;height:170px;object-fit:contain;background:repeating-conic-gradient(#ece5f0 0% 25%,#faf6ff 0% 50%) 0/18px 18px}.asset figcaption{font-weight:bold;font-size:13px;margin:8px 0}.asset a{color:#694580}.note{color:#795f83}@media(max-height:500px){header{padding:5px 10px}h1{font-size:15px;display:inline}header p{display:inline;font-size:11px;margin-left:8px}nav{margin-top:5px;gap:4px}label,select,button{font-size:11px}select,button{padding:4px}iframe{height:calc(100svh - 84px);min-height:240px}}
</style></head><body><header><h1>ハロウィン家具・配置プレビュー</h1><p class="note">確認専用です。景品の取得・家具の選択は通常のセーブに保存されません。</p><nav>
<label>回し車<select data-kind="wheel"><option value="wheel">④ ハロウィン回し車</option><option value="">いつもの回し車</option></select></label>
<label>ごはん皿<select data-kind="bowl"><option value="bowl">⑤ おばけのごはん皿</option><option value="">いつものごはん皿</option></select></label>
<label>棚<select data-kind="shelf"><option value="shelf">⑥ ハロウィン推しケツ棚</option><option value="">木製棚</option></select></label>
<label>床置き家具<select data-kind="floor"><option value="broom">⑦ 魔女のほうき</option><option value="lantern">⑧ おばけランタン</option><option value="basket">⑨ キャンディバスケット</option><option value="cauldron">⑩ 魔法の大釜</option><option value="">いつもの丸太トンネル</option></select></label>
<button id="original">元のケージと比較</button><button id="all">ハロウィン家具に戻す</button>
</nav></header><iframe id="cage" title="実際のケージ・家具配置確認" src="index.html?furniturePreview=1&amp;v=halloween-assets-4"></iframe>
<section><h2>個別の透過PNG</h2><p>背景の市松模様は透明部分を確認するための表示です。PNGには入りません。①～③のハウスは変更していません。</p><div class="assets" id="assets"></div><p>床置き家具は同じ設置ポイントへ1つだけ表示します。ゲーム内の「カスタム → 床置き家具」でも選択できます。</p></section>
<script>
const frame=document.querySelector('#cage'),selects=[...document.querySelectorAll('select')];function send(s){frame.contentWindow.postMessage({type:'halloween-preview',kind:s.dataset.kind,id:s.value?'halloween2026-'+s.value:null},location.origin==='null'?'*':location.origin)}for(const s of selects)s.onchange=()=>send(s);document.querySelector('#original').onclick=()=>{for(const s of selects){s.value='';send(s)}};document.querySelector('#all').onclick=()=>{for(const s of selects){s.selectedIndex=0;send(s)}};
for(const [id,label]of [['wheel','④ ハロウィン回し車'],['bowl','⑤ おばけのごはん皿'],['shelf','⑥ ハロウィン推しケツ棚'],['broom','⑦ 魔女のほうき'],['lantern','⑧ おばけランタン'],['basket','⑨ キャンディバスケット'],['cauldron','⑩ 魔法の大釜']]){const figure=document.createElement('figure');figure.className='asset';const img=new Image();img.src='assets/events/halloween2026/'+id+'.png';img.alt=label;const caption=document.createElement('figcaption');caption.textContent=label;const a=document.createElement('a');a.href=img.src;a.download=id+'.png';a.textContent='透過PNGを保存';figure.append(img,caption,a);document.querySelector('#assets').append(figure)}
</script></body></html>
